<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>SAJA · Panel</title>
<meta name="theme-color" content="#0b0b0b">
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/admin.css">
</head>
<body>

<!-- ===== Login ===== -->
<section class="login" id="login">
  <form class="login-card" id="loginForm" autocomplete="on">
    <img src="logo.png" alt="SAJA Perfumes" class="logo-inv login-logo" onerror="this.outerHTML='<b class=logo-txt>SAJA</b>'">
    <h1>Panel de administración</h1>
    <p class="sub">Ingresa con tu usuario</p>
    <label>Usuario<input name="u" id="lu" autocomplete="username" required autocapitalize="none" spellcheck="false"></label>
    <label>Contraseña<input name="p" id="lp" type="password" autocomplete="current-password" required></label>
    <button class="btn gold wide" id="loginBtn">ENTRAR</button>
    <p class="err" id="loginErr"></p>
  </form>
</section>

<!-- ===== App ===== -->
<div class="app" id="app" hidden>
  <aside class="side" id="side">
    <div class="side-brand"><img src="logo.png" alt="SAJA Perfumes" class="logo-inv" onerror="this.outerHTML='<b class=logo-txt>SAJA</b>'"></div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <b>SAJA</b><span>PERFUMES</span>
      <small>Estilo que te define.</small>
      <em>V 2.0.0</em>
    </div>
  </aside>

  <main class="main">
    <header class="bar">
      <button class="ic only-m" id="btnSide" title="Menú"><svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
      <div class="bar-title"><h2 id="viewTitle">PUNTO DE VENTA</h2><p id="viewSub"></p></div>
      <div class="bar-search">
        <input type="search" id="gSearch" placeholder="Buscar producto..." autocomplete="off">
        <svg viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M8 12h8"/></svg>
      </div>
      <div class="bar-right">
        <div class="me"><div class="avatar" id="meAvatar">A</div><div class="me-txt"><b id="meName"></b><small id="meRole"></small></div></div>
        <button class="ic" id="alarmBtn" title="Cobros pendientes"><svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 20a2 2 0 0 0 4 0"/></svg><i class="dot" id="alarmCount" hidden>0</i></button>
        <button class="ic" id="helpBtn" title="Ayuda"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17.5v.01"/></svg></button>
        <button class="ic" id="cfgBtn" title="Configuración"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4.9a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.5a7 7 0 0 0-2 1.2l-2.4-.9-2 3.4 2 1.6a7 7 0 0 0 0 2.4l-2 1.6 2 3.4 2.4-.9a7 7 0 0 0 2 1.2L10 21h4l.5-2.5a7 7 0 0 0 2-1.2l2.4.9 2-3.4-2-1.6c.1-.4.1-.8.1-1.2Z"/></svg></button>
        <button class="ic" id="btnLogout" title="Cerrar sesión"><svg viewBox="0 0 24 24"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 16l-4-4 4-4M6 12h10"/></svg></button>
        <span class="sync" id="sync" title="Conexión"></span>
      </div>
    </header>
    <div class="view" id="view"></div>
  </main>
  <div class="scrim" id="scrim"></div>
</div>

<div class="modal" id="modal"><div class="modal-card" id="modalCard"></div></div>
<div class="toast" id="toast"></div>
<div id="printArea"></div>

<script src="assets/firebase-config.js"></script>
<script src="assets/products-data.js"></script>
<script type="module" src="assets/admin.js"></script>
</body>
</html>
